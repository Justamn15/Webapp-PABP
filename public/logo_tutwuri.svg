    <!-- Sayap Kiri -->
    <path d="M 100,105 C 75,90 40,95 32,120 C 45,130 70,128 95,120 Z"/>
    <path d="M 100,115 C 80,105 50,110 42,132 C 55,140 78,138 98,128 Z"/>
