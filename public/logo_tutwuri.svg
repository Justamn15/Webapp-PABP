<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Lingkaran Biru Luar -->
  <circle cx="100" cy="100" r="92" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
  <circle cx="100" cy="100" r="85" fill="#ffffff"/>
  <circle cx="100" cy="100" r="82" fill="#0ea5e9"/>

  <!-- Sayap Kiri dan Kanan (Bulu Sayap Tut Wuri) -->
